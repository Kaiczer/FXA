### Characters
GNM_ma_hongkui: "Ma Hongkui"
# GNM_ma_hongkui_desc: "A member of the Ma Clique, Ma Hongkui was the son of Ma Fuxiang and a prominent warlord in Gansu. Known for his strict governance and efforts to modernize his territory, he played a significant role in the politics of Northern Ma Cliques during the early 20th century."
GNM_ma_hongbin: "Ma Hongbin"
# GNM_ma_hongbin_desc: "Ma Hongbin was a Chinese Muslim general and warlord of the Ma Clique, governing parts of Gansu."
