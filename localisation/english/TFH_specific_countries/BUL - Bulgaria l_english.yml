BUL_despotism_party: "Patriots' Union" # Pro-Bulgarian IMRO, anti-Zveno, core of the SBP, dictatorship of Protogerov
BUL_despotism_party_long: "Union of the Bulgarian Patriots (Sŭyuz na Bŭlgarskite Patrioti)"
BUL_ultranationalism_party: "Orthodoxy Patriots" # Hardline wing, formerly the Bulgarian Volunteer Legion, pro-Austrian Bulgarian army in Eastern Front, later pro-Ferdinand and anti-Zveno, core of the SBP
BUL_ultranationalism_party_long: "Union of the Bulgarian Patriots - Orthodoxy (Sŭyuz na Bŭlgarskite Patrioti - Ortodoksia)"
