### Ideology Subtype Desc
authoritarian_socialism_subtype_desc: "Authoritarian Socialism, also called statist or totalitarian socialism, is a system where the government has strict control over the economy and society, often limiting political freedoms. The state owns key industries, enforces central planning, and suppresses opposition to maintain power. While these regimes claim to work toward a classless society, power often remains in the hands of a ruling elite. This leads to censorship, restricted freedoms, and government control over many aspects of life."
vanguard_socialism_subtype_desc: "Vanguard Socialism is based on the idea that a small, well-organized group should lead the working class in revolution. This elite group—often a socialist party—guides and educates workers on overthrowing capitalism. The goal is to establish a socialist state where power rests with the working class. However, critics argue that vanguard socialism can lead to paternalism rule, as power tends to concentrate in the hands of a few."
revolutionary_socialism_subtype_desc: "Revolutionary Socialism rejects gradual reforms and insists that capitalism must be overthrown through mass uprisings or armed struggle. It calls for the collective ownership of resources and the elimination of private property. This ideology opposes imperialism and nationalism, emphasizing global working-class unity. Revolutionary socialism envisions a fair, democratic, and just society free from capitalist exploitation and oppression."
social_democracy_subtype_desc: "Social Democracy is an ideology whose goal is to reform capitalism and humanize it by aligning it with the ethical ideals of social welfare while maintaining the capitalist mode of production, rather than creating an alternative socialist economic system. While usually promoting a plutocratic form of government and a heavily regulated market economy, some more radical streams exist."
social_liberalism_subtype_desc: "Social Liberalism is a variation on mainstream classic liberalism, with the main difference being is the inclusion of various civil freedoms as basic human rights. Professing progressive social and economic policies the social liberals aim to create a society where every individual is free to live his own life with full opportunities regardless of their status."
classical_liberalism_subtype_desc: "Classical Liberalism champions free markets, individual liberties, and minimal government intervention. Unlike social liberals, classical liberals oppose welfare programs, high taxes, and heavy state control. Their ideas align with 19th-century thinkers like Adam Smith and John Locke, emphasizing economic freedom, natural law, and utilitarianism. While they share some views with conservative liberals, they reject protectionism and excessive government interference. Thinkers like Friedrich Hayek and Ludwig von Mises helped shape this ideology, which seeks a balance between economic growth and personal freedom."
social_conservatism_subtype_desc: "Social Conservatism is a political ideology which can vary greatly depending on the political history of the region or nation. Nonetheless, it is normally centred on preserving traditional beliefs, attitudes and philosophy as well as the traditional power dynamic of society while using the democratic system. Opposed to both radical and moderate changes to the status quo, conservatives want to keep society in order and stable. Most conservative societies usually promote a regulated market economy and economic protectionism."
paternalism_subtype_desc: "Paternalism is characterized by an intentionally blurred boundary between democratic and authoritarian governance, defying easy categorization. The regime pursues radical centralization and a tight grip on national authority, systematically co-opting all legitimate institutions to reinforce its rule. This culminates in an imperial executive, whose self-portrayal as the 'absolute protector' and 'father of the people', often against the wishes of its majority. Notwithstanding internal disagreements on economic policy, ranging from state control to market liberalization. But one thing that so much adores those who embrace it, the power in their hand must be stronger than it used to."
national_corporatism_subtype_desc: "National Corporatism reimagines the state as a biological organism—an organic Leviathan—rather than a collection of individuals. Fusing administrative vigor with traditionalism, it replaces democratic friction and class conflict with a disciplined, non-partisan hierarchy of technical experts. The market’s invisible hand is replaced by the state’s visible fist, directing a command economy where capitalism serves national survival. Individualism yields to mutualism, transforming the population into a synchronized resource. By prioritizing a permanent state of preparedness over chaotic populism, this system ensures the nation-state remains an unshakable, singular entity against a hostile world."
volkism_subtype_desc: "Born from Years of Shame's era of instability, Volkism is an authoritarian synthesis of Prussian socialism, national corporatism, and völkisch nationalism. It rejects Western liberalism and Marxism, favoring a German handcraft social order. The ideology enforces absolute loyalty to an organic state through forced class collaboration and state-backed economic control. Characterized by cultural occultism, social militarism, and pan-nationalism expansion, Volkism prioritizes collective strength over individualism. Under a supreme leader’s rule, it demands total cultural conformity, aiming to forge a disciplined, mystical, and unshakable nation-state prepared for perpetual struggle."
despotism_subtype_desc: "Despotism is a system where absolute power rests in the hands of a single ruler, unchecked by law, tradition, or opposition. The state is shaped by their will alone, with decisions enforced through fear, loyalty, and force. Promising order and strength, despotism often descends into repression and paranoia, as stability depends entirely on the ruler’s control. Whether justified by divine right, military dominance, or sheer ambition, the despot stands above all, ruling without challenge and bending the nation to their desires."
ultranationalism_subtype_desc: "Ultranationalism is the final fever of nationalism — the belief that the nation’s purity, destiny, and strength are supreme above all moral, political, or human considerations. It worships struggle, exalts the state, and defines the citizen by blood, not belief. All institutions exist to serve the myth of national rebirth, often through militarism, ethnic unity, and expansion. The leader becomes the living embodiment of the nation’s will. It brooks no dissent, tolerates no weakness, and demands total sacrifice for the glory of the nation."


