### Decisions ###
generic_raise_stability: "[generic_raise_stability_text]"
generic_raise_stability_desc: "[generic_raise_stability_desc_text]"

generic_raise_stability_socialist: "Improved Worker Conditions"
generic_raise_stability_socialist_desc: "Factory work is hard and fraught with many hazards. Improving the conditions for our factory workers will reduce output in the short term, but the long term benefits are worth it."

generic_raise_stability_democratic: "Legislate Freedoms"
generic_raise_stability_democratic_desc: "Perhaps the easiest way to improve our country's stability is to give the people what they want. It will involve some uncomfortable compromises, but ideally, these are measures that are only temporary and designed to placate them until order can properly be restored."

generic_raise_stability_conservative: "Police Crackdown"
generic_raise_stability_conservative_desc: "Disorder has become rampant. We must loosen the restrictions on our police forces, and give them the freedom to do their jobs in arresting the worst of the perpetrators."

generic_raise_stability_dictatorship: "Send in the Army"
generic_raise_stability_dictatorship_desc: "The way to deal with disorder in our nation is to send in the army and suppress it completely. Not everyone will be happy about it, that's true, but sometimes martial law is the only alternative."

generic_raise_support: "[generic_raise_support_text]"
generic_raise_support_desc: "[generic_raise_support_desc_text]"

rally_public_support: "Rally Public Support"
rally_public_support_desc: "With some political power and some industrial backing, we will rally our supporters to our cause. While this will take time and resources, in the long run, this will improve our political standing."

solidify_control: "Solidify Control"
solidify_control_desc: "Some tactful use of political power here and some resources there and we will remove our political obstacles; we may not be able to get rid of all of them, but even getting rid of some will clear our path and improve our political power in the long run."

restructure_supply_system: "Reorganise the Railway System"
restructure_supply_system_desc: "By redirecting building materials and railway workers, we can quickly create a small number of make-shift supply dumps along some of our railways. This is not sustainable, however. \n\n§RThis decision can only be taken once. The bonus will disappear if you construct more than 3 additional supply hubs.§!"

